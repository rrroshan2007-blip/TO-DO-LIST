    <meta name="description" content="Make space for what matters. A calm, Sand & Graphite personal productivity and task management workspace." />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dayform_active_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === 'system' && prefersDark) || (!saved && false)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#343B46] dark:bg-[#20252C] dark:text-[#F4F0E9] antialiased selection:bg-[#C18C64]/20 selection:text-[#343B46] dark:selection:bg-[#C69A76]/30 dark:selection:text-[#F4F0E9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
